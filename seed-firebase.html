      font-size: .9rem;

      color: #000;

    }

      background: #f0c040;

      color: #000;

      font-size: 1rem;
    }

    #loginBtn:hover,
    #logoutBtn:hover,
    #seedBtn:hover {
      opacity: .85;
    }

    #loginBtn:disabled,
    #logoutBtn:disabled,
    #seedBtn:disabled {
      opacity: .45;

      cursor: not-allowed;
    }

    .user-status {

      display: none;

      margin-top: 12px;

      padding: 10px;

      border-radius: 6px;

      background: #111;

      color: #4caf50;

      font-size: .8rem;

      display: flex;

      flex-direction: column;

      align-items: center;

      width: 100%;
    }

      margin-bottom: 0;
    }

      margin-top: 24px;

        descricaoLonga: "Estrutura indicada para pet shops e estabelecimentos que precisam de um espaço organizado para acomodação dos animais durante a rotina de atendimento.",

        imagem: [
          "./imgs/Products/Laminas/Canil3MódulosPlenitudeAzul1.png",
          "./imgs/Products/Laminas/Canil3MódulosPlenitudeAzul2.png"
        ],

        especificacoes: [
          "3 módulos",
          "Portas de vidro",
          "Cor azul",
          "Uso profissional"
        ]
      },


      {
        id: 20,
        nome: "Canil Rotomoldado Essencial Pro - 6 Lugares",
        categoria: "Acessórios",
        marca: "Plenitude",
        preco: 8117.00,
        preco10x: 9334.55,
        offer: "off",

        descricao: "Canil rotomoldado com seis lugares, desenvolvido para acomodação de animais em ambientes profissionais.",

        descricaoLonga: "Solução para pet shops e centros de estética animal que necessitam de maior capacidade de acomodação e organização durante a rotina de atendimento.",

        imagem: [
          "./imgs/Products/Laminas/CanilRotomoldadoEssencialPro1.png",
          "./imgs/Products/Laminas/CanilRotomoldadoEssencialPro2.png"
        ],

        especificacoes: [
          "6 lugares",
          "Modelo rotomoldado",
          "Linha Essencial Pro",
          "Uso profissional"
        ]
      },


      {
        id: 21,
        nome: "Máquina de Secar Topline - 2 Lugares",
        categoria: "Secadores",
        marca: "Plenitude",
        preco: 10791.00,
        preco10x: 12409.65,
        offer: "off",

        descricao: "Máquina de secar profissional com duas portas, desenvolvida para atender à rotina de pet shops e centros de estética animal.",

        descricaoLonga: "Equipamento destinado à secagem profissional de animais, oferecendo uma solução prática para estabelecimentos que buscam mais eficiência e estrutura para os processos de banho e tosa.",

        imagem: [
          "./imgs/Products/Laminas/SecadoraPlenitude2Portas1.png",
          "./imgs/Products/Laminas/SecadoraPlenitude2Portas2.png"
        ],

        especificacoes: [
          "Modelo com 2 portas",
          "Cor preta",
          "Uso profissional",
          "Ideal para pet shops e centros de estética animal"
        ]
      }

    ];


    // ============================================================
    // CATEGORIAS
    // ============================================================

    const categorias = [

      {
        id: "all",
        nome: "Todos",
        icone: "fa-border-all"
      },

      {
        id: "Secadores",
        nome: "Secadores",
        icone: "fa-wind"
      },

      {
        id: "Sopradores",
        nome: "Sopradores",
        icone: "fa-wind"
      },

      {
        id: "Lâminas",
        nome: "Lâminas",
        icone: "fa-scissors"
      },

      {
        id: "Tesouras",
        nome: "Tesouras",
        icone: "fa-scissors"
      },

      {
        id: "Máquinas",
        nome: "Máquinas",
        icone: "fa-gears"
      },

      {
        id: "Acessórios",
        nome: "Acessórios",
        icone: "fa-toolbox"
      }

    ];


    // ============================================================
    // CUPONS
    // ============================================================

    const cupons = [

      {
        docId:
          "DESCONTO10",

        codigo:
          "DESCONTO10",

        tipo:
          "percentual",

        valor:
          10,

        valorMinimo:
          0,

        validade:
          null,

        ativo:
          true

      }

    ];


    // ============================================================
    // LOGIN
    // ============================================================

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        const senha =
          senhaInput.value;


        if (!email || !senha) {

          addLog(
            "✘ Informe o e-mail e a senha.",
            "err"
          );

          return;
        }


        loginBtn.disabled = true;


        addLog(
          "▶ Autenticando...",
          "info"
        );


        try {

          const credential =
            await auth.signInWithEmailAndPassword(
              email,
              senha
            );


          addLog(
            `✔ Login realizado: ${credential.user.email}`,
            "ok"
          );


          userStatus.style.display =
            "block";


          userStatus.textContent =
            `✔ Autenticado como: ${credential.user.email}`;


          seedBtn.disabled =
            false;


          loginBtn.style.display =
            "none";


          logoutBtn.style.display =
            "block";


          emailInput.disabled =
            true;


          senhaInput.disabled =
            true;


        } catch (e) {

          console.error(
            "Erro de autenticação:",
            e
          );


          addLog(
            `✘ Erro no login: ${e.message}`,
            "err"
          );


          seedBtn.disabled =
            true;

        } finally {

          loginBtn.disabled =
            false;
        }

      }
    );


    // ============================================================
    // LOGOUT
    // ============================================================

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await auth.signOut();


          userStatus.style.display =
            "none";


          seedBtn.disabled =
            true;


          loginBtn.style.display =
            "block";


          logoutBtn.style.display =
            "none";


          emailInput.disabled =
            false;


          senhaInput.disabled =
            false;


          senhaInput.value =
            "";


          addLog(
            "✔ Usuário desconectado.",
            "info"
          );


        } catch (e) {

          addLog(
            `✘ Erro ao sair: ${e.message}`,
            "err"
          );
        }

      }
    );


    // ============================================================
    // OBSERVAR ESTADO DE AUTENTICAÇÃO
    // ============================================================

    auth.onAuthStateChanged(
      (user) => {

        if (user) {

          userStatus.style.display =
            "block";


          userStatus.textContent =
            `✔ Autenticado como: ${user.email}`;


          seedBtn.disabled =
            false;


          loginBtn.style.display =
            "none";


          logoutBtn.style.display =
            "block";


          emailInput.disabled =
            true;


          senhaInput.disabled =
            true;


        } else {

          userStatus.style.display =
            "none";


          seedBtn.disabled =
            true;


          loginBtn.style.display =
            "block";


          logoutBtn.style.display =
            "none";


          emailInput.disabled =
            false;


          senhaInput.disabled =
            false;
        }

      }
    );


    // ============================================================
    // SEED FIREBASE
    // ============================================================

    seedBtn.addEventListener(
      "click",
      async () => {

        // ----------------------------------------------------
        // GARANTIR AUTENTICAÇÃO
        // ----------------------------------------------------

        const user =
          auth.currentUser;


        if (!user) {

          addLog(
            "✘ Você precisa estar autenticado.",
            "err"
          );

          return;
        }


        // ----------------------------------------------------
        // BLOQUEAR BOTÃO
        // ----------------------------------------------------

        seedBtn.disabled =
          true;


        log.innerHTML = "";


        addLog(
          "▶ Usuário autenticado.",
          "ok"
        );


        addLog(
          `▶ Conta: ${user.email}`,
          "info"
        );


        addLog(
          "▶ Iniciando envio...",
          "info"
        );


        let produtosOk =
          0;

        let categoriasOk =
          0;

        let cuponsOk =
          0;

        let erros =
          0;


        // ====================================================
        // PRODUTOS
        // ====================================================

        addLog(
          "",
          "info"
        );


        addLog(
          `▶ Enviando ${produtos.length} produtos...`,
          "info"
        );


        for (
          const p of produtos
        ) {

          try {

            await db
              .collection(
                "produtos"
              )
              .doc(
                String(p.id)
              )
              .set({

                ...p,

                ativo:
                  true,

                destaque:
                  false,

                criadoEm:
                  firebase
                    .firestore
                    .FieldValue
                    .serverTimestamp()

              });


            addLog(
              `✔ [${p.id}] ${p.nome}`,
              "ok"
            );


            produtosOk++;


          } catch (e) {

            console.error(
              `Erro no produto ${p.id}:`,
              e
            );


            addLog(
              `✘ [${p.id}] ${p.nome} — ${e.message}`,
              "err"
            );


            erros++;
          }
        }


        // ====================================================
        // CATEGORIAS
        // ====================================================

        addLog(
          "",
          "info"
        );


        addLog(
          "▶ Enviando categorias...",
          "info"
        );


        for (
          const c of categorias
        ) {

          try {

            await db
              .collection(
                "categorias"
              )
              .doc(
                c.id
              )
              .set(c);


            addLog(
              `✔ Categoria: ${c.nome}`,
              "ok"
            );


            categoriasOk++;


          } catch (e) {

            console.error(
              `Erro na categoria ${c.nome}:`,
              e
            );


            addLog(
              `✘ Categoria: ${c.nome} — ${e.message}`,
              "err"
            );


            erros++;
          }
        }


        // ====================================================
        // CUPONS
        // ====================================================

        addLog(
          "",
          "info"
        );


        addLog(
          "▶ Enviando cupons...",
          "info"
        );


        for (
          const c of cupons
        ) {

          try {

            const {
              docId,
              ...dados
            } = c;


            await db
              .collection(
                "cupons"
              )
              .doc(
                docId
              )
              .set(dados);


            addLog(
              `✔ Cupom: ${c.codigo}`,
              "ok"
            );


            cuponsOk++;


          } catch (e) {

            console.error(
              `Erro no cupom ${c.codigo}:`,
              e
            );


            addLog(
              `✘ Cupom: ${c.codigo} — ${e.message}`,
              "err"
            );


            erros++;
          }
        }


        // ====================================================
        // RESULTADO
        // ====================================================

        addLog(
          "",
          "info"
        );


        addLog(
          "━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
          "info"
        );


        addLog(
          `✔ Produtos: ${produtosOk}/${produtos.length}`,
          produtosOk === produtos.length
            ? "ok"
            : "warning"
        );


        addLog(
          `✔ Categorias: ${categoriasOk}/${categorias.length}`,
          categoriasOk === categorias.length
            ? "ok"
            : "warning"
        );


        addLog(
          `✔ Cupons: ${cuponsOk}/${cupons.length}`,
          cuponsOk === cupons.length
            ? "ok"
            : "warning"
        );


        addLog(
          `✘ Erros: ${erros}`,
          erros > 0
            ? "err"
            : "ok"
        );


        if (
          erros === 0
        ) {

          addLog(
            "🎉 SEED CONCLUÍDO COM SUCESSO!",
            "ok"
          );

        } else {

          addLog(
            "⚠ O SEED TERMINOU COM ERROS.",
            "err"
          );
        }


        addLog(
          "━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
          "info"
        );


        // Permitir executar novamente.
        seedBtn.disabled =
          false;

      }
    );

  </script>
